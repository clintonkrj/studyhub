<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyHub – IBW Hochschule Aalen</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1d1b2e;--mu:#6b6a80;--pr:#5b4bc4;--pr2:#ede9ff;--bd:#e2e1ee;--ok:#1f9d6b;--wa:#d98a00;--er:#d6455d;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#14131f;--card:#1e1d2d;--tx:#eceaf7;--mu:#9d9bb5;--pr:#8f82ff;--pr2:#2b2848;--bd:#2f2e45}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}header h1 span{color:var(--pr)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{border:0;background:none;color:var(--mu);padding:8px 14px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pr2);color:var(--pr)}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
h2{margin:0 0 12px;font-size:18px}h3{margin:0 0 8px;font-size:15px;color:var(--mu);font-weight:600}
.big{font-size:28px;font-weight:700}.mu{color:var(--mu);font-size:13px}
input,select,textarea,button.b{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
textarea{width:100%;min-height:320px;resize:vertical}
button.b{background:var(--pr);color:#fff;border-color:var(--pr);font-weight:600;cursor:pointer}button.g{background:none;color:var(--pr)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}.item .t{flex:1}
.done .t{text-decoration:line-through;color:var(--mu)}
.tag{font-size:12px;background:var(--pr2);color:var(--pr);border-radius:99px;padding:2px 9px;font-weight:600}
.x{border:0;background:none;color:var(--er);cursor:pointer;font-size:16px}
.bar{height:10px;background:var(--pr2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{text-align:center;color:var(--mu);font-size:12px;font-weight:600}
.d{min-height:70px;border:1px solid var(--bd);border-radius:10px;padding:4px;font-size:11px;cursor:pointer;overflow:hidden}
.d.o{opacity:.4}.d.td{border-color:var(--pr)}.d.sel{background:var(--pr2)}.d b{font-size:12px}
.ch{display:block;background:var(--pr);color:#fff;border-radius:5px;padding:0 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch.e{background:var(--er)}.ch.o2{background:var(--wa)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.pills button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:5px 12px;cursor:pointer;font:inherit}.pills button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.hero{background:linear-gradient(135deg,#5b4bc4,#9b5cf0);color:#fff;border-radius:20px;padding:20px;margin-bottom:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px rgba(91,75,196,.3)}.hero h1{margin:0;font-size:24px}.hero .mu{color:rgba(255,255,255,.85)}.chip{background:rgba(255,255,255,.18);border-radius:12px;padding:8px 12px;font-size:12px}.chip b{display:block;font-size:16px}
.ring{width:88px;height:88px;border-radius:50%;background:conic-gradient(#fff var(--p),rgba(255,255,255,.25) 0);display:grid;place-items:center;position:relative}.ring:before{content:"";position:absolute;inset:8px;border-radius:50%;background:#7455d9}.ring span{position:relative;font-weight:800;font-size:20px;text-align:center;line-height:1}.ring small{display:block;font-size:10px;font-weight:600;opacity:.85}
.tm{font-size:68px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0}.fc{min-height:190px;display:grid;place-items:center;text-align:center;font-size:21px;font-weight:600;cursor:pointer;border-radius:var(--r);background:linear-gradient(135deg,var(--pr2),var(--card));border:1px solid var(--bd);padding:24px;user-select:none}
.card{transition:transform .15s,box-shadow .15s}.card:hover{box-shadow:0 6px 20px rgba(91,75,196,.1)}
@media(max-width:600px){.d{min-height:52px}.ch{font-size:9px}}
</style>
</head>
<body>
<header><h1>Study<span>Hub</span> · IBW Aalen</h1>
<label class="mu">Semester <select id="sem" onchange="S.sem=+this.value;save();render()"></select></label></header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
const URL0="https://vorlesungen.htw-aalen.de/splan/ical?lan=de&puid=54&type=pg&pgid=14700";
const raw=[
[1,'p',5,'Einführung in die Internationale BWL'],[1,'p',5,'Marketing'],[1,'p',5,'Wissenschaftliches Arbeiten'],[1,'p',5,'Intercultural Management'],[1,'p',5,'Wirtschaftsmathematik'],[1,'p',5,'Business Englisch I'],
[2,'p',5,'Supply Chain Management'],[2,'p',5,'Wirtschaftsinformatik'],[2,'p',5,'Wirtschaftsprivatrecht'],[2,'p',5,'Einführung in die VWL'],[2,'p',5,'Buchführung und Bilanzierung'],[2,'p',5,'Business Englisch II'],
[3,'p',5,'Organizational Structure'],[3,'p',5,'Unternehmensbesteuerung'],[3,'p',5,'Kosten- und Leistungsrechnung'],[3,'p',5,'Investition und Finanzierung'],[3,'p',5,'Statistik für Wirtschaftswissenschaftler'],[3,'p',5,'International Economics'],
[4,'p',5,'Personalmanagement'],[4,'p',5,'Projektmanagement'],[4,'p',5,'Controlling'],[4,'p',5,'Digital Business Systems'],
[4,'s',10,'SP: Finance, Accounting, Controlling and Taxation (Teil 1)'],[4,'s',10,'SP: Marketing (Teil 1)'],[4,'s',10,'SP: HR and Business Transformation (Teil 1)'],[4,'s',10,'SP: International Management (Teil 1)'],
[5,'p',30,'Praxissemester'],
[[6,7],'s',20,'SP: Finance, Accounting, Controlling and Taxation'],[[6,7],'s',20,'SP: Marketing'],[[6,7],'s',20,'SP: HR and Business Transformation'],[[6,7],'s',20,'SP: International Management'],
[6,'p',5,'Leadership'],[6,'p',5,'Business Ethics and Corporate Governance'],[6,'w',5,'Wahlpflichtmodul 1'],
[7,'p',5,'Strategic Management'],[7,'w',5,'Wahlpflichtmodul 2'],[7,'p',12,'Bachelorthesis'],[7,'p',3,'Studium Generale']];
const M=raw.map((r,i)=>({id:'m'+i,s:[].concat(r[0]),t:r[1],cp:r[2],n:r[3]}));
const modsOf=s=>M.filter(m=>m.s.includes(s)),mn=id=>(M.find(m=>m.id==id)||{n:'Allgemein'}).n;
const K='studyhub-ibw-v1';let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S=Object.assign({cards:{},study:{},cv:'m',name:'Clinton',sem:1,tab:'dash',todos:[],exams:[],notes:{},grades:{},events:[],ics:[],url:URL0},S);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9),p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dk=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const fd=t=>new Date(t).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'}),ft=t=>new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const days=d=>Math.ceil((new Date(d+'T00:00')-new Date().setHours(0,0,0,0))/864e5);
const opts=(l,sel)=>l.map(m=>`<option value="${m.id}" ${m.id==sel?'selected':''}>${esc(m.n)}</option>`).join('');
const TABS=[['dash','🏠 Übersicht'],['cal','📅 Kalender'],['todo','✅ To-dos'],['exam','🎯 Klausuren'],['timer','⏱ Fokus'],['notes','📝 Lernzettel'],['cards','🃏 Karteikarten'],['grades','📊 Noten & CP'],['sem','🗂 Semesterplan']];
let CM=new Date(),SD=dk(new Date()),NM=null,NN=null,CS={id:0,f:0},T={run:0,left:1500,tot:1500,fm:25,mode:'f',end:0,iv:0,m:null};
const sd=k=>Object.values(S.study[k]||{}).reduce((a,b)=>a+b,0);
const lastDays=n=>[...Array(n)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(n-1-i));return d});
const streak=()=>{let n=0,d=new Date();if(!sd(dk(d)))d.setDate(d.getDate()-1);while(sd(dk(d))>0){n++;d.setDate(d.getDate()-1)}return n};
const wkMin=()=>lastDays(7).reduce((a,d)=>a+sd(dk(d)),0);
const hm=m=>m>=60?Math.floor(m/60)+' h '+Math.round(m%60)+' min':Math.round(m)+' min';
const pm=()=>{const t={};lastDays(7).forEach(d=>Object.entries(S.study[dk(d)]||{}).forEach(([i,v])=>t[i]=(t[i]||0)+v));return t};
const logMin=(id,m)=>{const k=dk(new Date());S.study[k]=S.study[k]||{};S.study[k][id]=(S.study[k][id]||0)+m;save()};
const weekChart=()=>{const l=lastDays(7).map(d=>[d,sd(dk(d))]),mx=Math.max(30,...l.map(x=>x[1]));return `<div style="display:flex;gap:6px;align-items:flex-end;height:110px;margin-top:8px">${l.map(([d,v])=>`<div style="flex:1;text-align:center"><div title="${Math.round(v)} min" style="height:${Math.max(3,v/mx*80)}px;background:var(--pr);border-radius:6px 6px 0 0;opacity:${v?1:.25}"></div><span class="mu">${['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()]}</span></div>`).join('')}</div>`};
const tmf=()=>p2(Math.floor(T.left/60))+':'+p2(T.left%60);
function paint(){const e=$('tm');if(e)e.textContent=tmf();document.title=T.run?tmf()+' · StudyHub':'StudyHub – IBW Hochschule Aalen'}
function tmTick(){T.left=Math.max(0,Math.round((T.end-Date.now())/1000));paint();if(T.left<=0){clearInterval(T.iv);T.run=0;if(T.mode=='f'){logMin(T.m||'x',T.tot/60);T.mode='b';T.tot=T.left=300}else{T.mode='f';T.tot=T.left=T.fm*60}if(navigator.vibrate)navigator.vibrate(300);render()}}
function tmGo(){if(T.run){clearInterval(T.iv);T.run=0}else{T.end=Date.now()+T.left*1000;T.run=1;T.iv=setInterval(tmTick,500)}render()}
function tmReset(){clearInterval(T.iv);T.run=0;T.left=T.tot;render()}
function tmSet(n){clearInterval(T.iv);T.run=0;T.mode='f';T.fm=n;T.tot=T.left=n*60;render()}
function addMin(e){e.preventDefault();logMin(T.m||'x',+e.target.n.value);render();return false}
function cg(k){const c=S.cards[NM].find(x=>x.id==CS.id);c.b=k?Math.min(3,c.b+1):0;CS.id=0;CS.f=0;save();render()}
function addCard(e){e.preventDefault();const f=e.target;(S.cards[NM]=S.cards[NM]||[]).push({id:uid(),q:f.q.value,a:f.a.value,b:0});save();render();return false}
const cardPick=l=>{const m=Math.min(...l.map(c=>c.b)),p=l.filter(c=>c.b==m);return p[Math.floor(Math.random()*p.length)]};
const sw=()=>`<div class="pills"><button class="${S.cv!='w'?'on':''}" onclick="S.cv='m';save();render()">Monat</button><button class="${S.cv=='w'?'on':''}" onclick="S.cv='w';save();render()">Woche</button></div>`;
const shW=n=>{const d=new Date(SD+'T00:00');d.setDate(d.getDate()+n);SD=dk(d);render()};
const wk=()=>{const b=new Date(SD+'T00:00');b.setDate(b.getDate()-((b.getDay()+6)%7));const ev=allEv();
 return `<div class="card"><div class="row"><button class="b g" onclick="shW(-7)">‹</button><h2 style="margin:0;flex:1;text-align:center">Woche ab ${b.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}</h2><button class="b g" onclick="shW(7)">›</button></div>`+[...Array(7)].map((_,i)=>{const d=new Date(b);d.setDate(b.getDate()+i);const k=dk(d),es=ev.filter(e=>dk(new Date(e.t))==k);return `<div class="item" style="align-items:flex-start"><div style="width:58px"><b>${['Mo','Di','Mi','Do','Fr','Sa','So'][i]}</b><div class="mu">${p2(d.getDate())}.${p2(d.getMonth()+1)}.</div></div><div class="t">${es.map(e=>`<div class="ch ${e.k}" style="white-space:normal;padding:3px 8px;margin:0 0 4px">${ft(e.t)} · ${esc(e.title)}${e.loc?' · '+esc(e.loc):''}</div>`).join('')||'<span class="mu">frei</span>'}</div></div>`}).join('')+`<form class="row" style="margin-top:12px" onsubmit="return addEv(event)"><input name="t" placeholder="Eigener Termin am ${SD}" required><input type="time" name="tm" value="10:00"><button class="b">Hinzufügen</button></form></div>`};

function parseICS(t){t=t.replace(/\r?\n[ \t]/g,'');const out=[];
 const pd=v=>{const m=v.match(/(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)?(Z)?)?/);if(!m)return 0;const a=[+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0)];return m[7]?Date.UTC(...a):new Date(...a).getTime()};
 t.split('BEGIN:VEVENT').slice(1).forEach(b=>{const g=k=>{const m=b.match(new RegExp('^'+k+'[^:\\r\\n]*:(.*)$','m'));return m?m[1].trim().replace(/\\n/g,' ').replace(/\\([,;])/g,'$1'):''};
  const s=pd(g('DTSTART'));if(s)out.push({t:s,e:pd(g('DTEND'))||s,title:g('SUMMARY'),loc:g('LOCATION')})});return out}
async function loadUrl(){try{const r=await fetch(S.url);S.ics=parseICS(await r.text());save();render();alert(S.ics.length+' Termine geladen.')}catch(e){alert('Direktes Laden vom Browser aus wird von der Hochschule blockiert (CORS). Lade die .ics-Datei über den Link herunter und importiere sie mit "Datei importieren".')}}
function impFile(f){if(!f)return;const r=new FileReader();r.onload=()=>{S.ics=parseICS(r.result);save();render()};r.readAsText(f)}
const allEv=()=>[...S.ics.map(e=>({...e,k:''})),...S.events.map(e=>({...e,k:'o2',own:1})),...S.exams.map(x=>({t:new Date(x.d+'T'+(x.tm||'09:00')).getTime(),title:'Klausur: '+mn(x.m),loc:x.r||'',k:'e'}))].sort((a,b)=>a.t-b.t);
const chips=e=>`<span class="ch ${e.k}" title="${esc(e.title)}">${ft(e.t)} ${esc(e.title)}</span>`;
const evRow=e=>`<div class="item"><div class="t"><b>${esc(e.title)}</b><div class="mu">${fd(e.t)} · ${ft(e.t)}${e.e>e.t?'–'+ft(e.e):''}${e.loc?' · '+esc(e.loc):''}</div></div></div>`;

const V={
dash(){const ev=allEv(),now=Date.now(),td=dk(new Date());
 const g=Object.entries(S.grades).filter(([,v])=>v&&v>0),cp=g.filter(([,v])=>v<=4).reduce((a,[id])=>a+M.find(m=>m.id==id).cp,0);
 const avg=(()=>{let w=0,s=0;g.forEach(([id,v])=>{if(v<=4){const c=M.find(m=>m.id==id).cp;w+=c;s+=c*v}});return w?(s/w).toFixed(2):'–'})();
 const open=S.todos.filter(t=>!t.done&&t.sem==S.sem),nx=S.exams.filter(x=>days(x.d)>=0).sort((a,b)=>a.d>b.d?1:-1)[0];
 return `<div class="hero"><div class="ring" style="--p:${cp/2.1}%"><span>${cp}<small>/ 210 CP</small></span></div><div style="flex:1;min-width:200px"><h1 style="cursor:pointer" onclick="S.name=prompt('Dein Name?',S.name)||S.name;save();render()">${new Date().getHours()<11?'Guten Morgen':new Date().getHours()<18?'Hallo':'Guten Abend'}, ${esc(S.name)} 👋</h1><div class="mu">${new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})} · Semester ${S.sem}</div></div><div class="chip">Nächster Termin<b>${(e=>e?ft(e.t)+' '+esc(e.title.slice(0,22)):'–')(ev.find(e=>e.t>now))}</b></div><div class="chip">Heute gelernt<b>${hm(sd(td))}</b></div><div class="chip">Lern-Streak<b>🔥 ${streak()} Tg.</b></div></div>
 <div class="grid"><div class="card"><h3>Lernzeit · 7 Tage</h3><div class="big">${hm(wkMin())}</div>${weekChart()}</div>
 <div class="card"><h3>Notenschnitt</h3><div class="big">${avg}</div></div>
 <div class="card"><h3>Offene To-dos (Sem. ${S.sem})</h3><div class="big">${open.length}</div></div>
 <div class="card"><h3>Nächste Klausur</h3><div class="big">${nx?'in '+days(nx.d)+' Tg.':'–'}</div><div class="mu">${nx?esc(mn(nx.m)):'Noch keine eingetragen'}</div></div></div>
 <div class="card"><h2>Heute</h2>${ev.filter(e=>dk(new Date(e.t))==td).map(evRow).join('')||'<div class="mu">Keine Termine heute. '+(S.ics.length?'':'Importiere im Kalender deinen Stundenplan.')+'</div>'}</div>
 <div class="card"><h2>Als Nächstes</h2>${ev.filter(e=>e.t>now).slice(0,6).map(evRow).join('')||'<div class="mu">Nichts geplant.</div>'}</div>
 <div class="card"><h2>Fällige To-dos</h2>${open.sort((a,b)=>(a.d||'9')>(b.d||'9')?1:-1).slice(0,5).map(t=>`<div class="item"><div class="t">${esc(t.x)}</div><span class="tag">${t.d?fd(t.d+'T00:00'):'ohne Datum'}</span></div>`).join('')||'<div class="mu">Alles erledigt 🎉</div>'}</div>
 <div class="card"><h3>Daten sichern</h3><div class="row"><button class="b g" onclick="exp()">Backup exportieren</button><label class="b g" style="cursor:pointer">Backup importieren<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label></div><div class="mu">Alles wird nur in diesem Browser gespeichert. Exportiere regelmäßig ein Backup, z. B. um es auf andere Geräte zu übertragen.</div></div>`},
cal(){const h=V.calM();return S.cv=='w'?sw()+wk()+h.slice(h.indexOf('<div class="card"><h2>Stundenplan')):sw()+h},
calM(){const y=CM.getFullYear(),m=CM.getMonth(),f=new Date(y,m,1),off=(f.getDay()+6)%7,ev=allEv(),cells=[];
 for(let i=0;i<42;i++){const d=new Date(y,m,1-off+i),k=dk(d),es=ev.filter(e=>dk(new Date(e.t))==k);
  cells.push(`<div class="d ${d.getMonth()!=m?'o':''} ${k==dk(new Date())?'td':''} ${k==SD?'sel':''}" onclick="SD='${k}';render()"><b>${d.getDate()}</b>${es.slice(0,3).map(chips).join('')}${es.length>3?'<span class="mu">+'+(es.length-3)+'</span>':''}</div>`)}
 const sel=ev.filter(e=>dk(new Date(e.t))==SD);
 return `<div class="card"><div class="row"><button class="b g" onclick="CM=new Date(${y},${m-1},1);render()">‹</button><h2 style="margin:0;flex:1;text-align:center">${CM.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</h2><button class="b g" onclick="CM=new Date(${y},${m+1},1);render()">›</button></div>
 <div class="cal">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div class="h">${d}</div>`).join('')}${cells.join('')}</div></div>
 <div class="card"><h2>${new Date(SD+'T00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}</h2>${sel.map(evRow).join('')||'<div class="mu">Keine Termine.</div>'}
 <form class="row" style="margin-top:12px" onsubmit="return addEv(event)"><input name="t" placeholder="Eigener Termin" required><input type="time" name="tm" value="10:00"><button class="b">Hinzufügen</button></form></div>
 <div class="card"><h2>Stundenplan (iCal)</h2><div class="row"><input id="url" value="${esc(S.url)}" style="flex:1;min-width:200px" onchange="S.url=this.value;save()"><button class="b" onclick="loadUrl()">Von URL laden</button><a class="b g" style="padding:8px 10px;border:1px solid var(--bd);border-radius:10px;text-decoration:none" href="${esc(S.url)}" target="_blank" rel="noopener">.ics öffnen</a><label class="b g" style="cursor:pointer">Datei importieren<input type="file" accept=".ics" hidden onchange="impFile(this.files[0])"></label></div><div class="mu">${S.ics.length} Vorlesungstermine geladen. Falls „Von URL laden“ blockiert wird: .ics herunterladen und importieren.</div></div>`},
todo(){const l=S.todos.filter(t=>t.sem==S.sem).sort((a,b)=>(a.done-b.done)||((a.d||'9')>(b.d||'9')?1:-1));
 return `<div class="card"><h2>To-dos · Semester ${S.sem}</h2><form class="row" onsubmit="return addTodo(event)"><input name="x" placeholder="Aufgabe…" required style="flex:1;min-width:160px"><select name="m"><option value="">Allgemein</option>${opts(modsOf(S.sem))}</select><input type="date" name="d"><select name="p"><option value="2">Normal</option><option value="1">Wichtig</option></select><button class="b">+</button></form>
 ${l.map(t=>`<div class="item ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="tg('${t.id}')"><div class="t">${t.p==1?'⭐ ':''}${esc(t.x)}<div class="mu">${esc(mn(t.m))}${t.d?' · fällig '+fd(t.d+'T00:00'):''}</div></div><button class="x" onclick="S.todos=S.todos.filter(a=>a.id!='${t.id}');save();render()">✕</button></div>`).join('')||'<div class="mu">Noch keine Aufgaben.</div>'}</div>`},
exam(){const l=S.exams.filter(x=>x.sem==S.sem).sort((a,b)=>a.d>b.d?1:-1);
 return `<div class="card"><h2>Klausurenplan · Semester ${S.sem}</h2><form class="row" onsubmit="return addEx(event)"><select name="m">${opts(modsOf(S.sem))}</select><input type="date" name="d" required><input type="time" name="tm" value="09:00"><input name="r" placeholder="Raum (optional)"><button class="b">Eintragen</button></form>
 ${l.map(x=>{const d=days(x.d);return `<div class="item"><div class="t"><b>${esc(mn(x.m))}</b><div class="mu">${fd(x.d+'T00:00')} · ${x.tm||''}${x.r?' · '+esc(x.r):''}</div></div><span class="tag" style="${d<=7&&d>=0?'background:var(--er);color:#fff':''}">${d<0?'vorbei':d==0?'heute':'in '+d+' Tg.'}</span><button class="x" onclick="S.exams=S.exams.filter(a=>a.id!='${x.id}');save();render()">✕</button></div>`}).join('')||'<div class="mu">Noch keine Klausuren. Termine findest du im Prüfungsplan der Hochschule.</div>'}</div>`},
notes(){const ms=modsOf(S.sem);if(!ms.find(m=>m.id==NM)){NM=ms[0].id;NN=null}const l=S.notes[NM]||[],n=l.find(a=>a.id==NN);
 return `<div class="pills">${ms.map(m=>`<button class="${m.id==NM?'on':''}" onclick="NM='${m.id}';NN=null;render()">${esc(m.n)}</button>`).join('')}</div>
 <div class="card"><h2>Lernzettel · ${esc(mn(NM))}</h2><div class="row">${l.map(a=>`<button class="b ${a.id==NN?'':'g'}" onclick="NN='${a.id}';render()">${esc(a.t||'Ohne Titel')}</button>`).join('')}<button class="b" onclick="newNote()">+ Neuer Zettel</button></div>
 ${n?`<input value="${esc(n.t)}" style="width:100%;margin-bottom:8px;font-weight:700" oninput="eN('t',this.value)" placeholder="Titel"><textarea oninput="eN('x',this.value)">${esc(n.x)}</textarea><div class="row" style="margin:8px 0 0"><span class="mu" style="flex:1">Wird automatisch gespeichert.</span><button class="x" onclick="delNote()">Zettel löschen</button></div>`:'<div class="mu">Wähle oder erstelle einen Lernzettel.</div>'}</div>`},
grades(){const ms=modsOf(S.sem);
 return `<div class="card"><h2>Noten · Semester ${S.sem}</h2>${ms.map(m=>`<div class="item"><div class="t">${esc(m.n)}<div class="mu">${m.cp} CP</div></div><input type="number" min="1" max="5" step="0.1" placeholder="Note" value="${S.grades[m.id]||''}" style="width:90px" onchange="S.grades['${m.id}']=+this.value||0;save();render()"></div>`).join('')}<div class="mu" style="margin-top:8px">Bestanden ab 4,0. Schnitt und CP in der Übersicht zählen alle Semester (Gewichtung nach CP; die offizielle Berechnung der Hochschule kann abweichen).</div></div>`},
timer(){const ms=modsOf(S.sem);if(!T.m||!ms.find(m=>m.id==T.m))T.m=ms[0].id;const pt=pm();
 return `<div class="card" style="text-align:center"><div class="pills" style="justify-content:center">${[25,50].map(n=>`<button class="${T.fm==n&&T.mode=='f'?'on':''}" onclick="tmSet(${n})">${n} min Fokus</button>`).join('')}</div><div class="mu">${T.mode=='f'?'Fokus':'Pause'}</div><div class="tm" id="tm">${tmf()}</div><div class="row" style="justify-content:center"><select onchange="T.m=this.value">${opts(ms,T.m)}</select><button class="b" onclick="tmGo()">${T.run?'Pause':'Start'}</button><button class="b g" onclick="tmReset()">Reset</button></div><div class="mu">Abgeschlossene Fokus-Runden werden dem Fach gutgeschrieben.</div></div>
 <div class="grid"><div class="card"><h3>Heute</h3><div class="big">${hm(sd(dk(new Date())))}</div></div><div class="card"><h3>7 Tage</h3><div class="big">${hm(wkMin())}</div></div><div class="card"><h3>Streak</h3><div class="big">🔥 ${streak()} Tg.</div></div></div>
 <div class="card"><h3>Letzte 7 Tage</h3>${weekChart()}</div>
 <div class="card"><h3>Lernzeit pro Fach (7 Tage)</h3>${Object.entries(pt).sort((a,b)=>b[1]-a[1]).map(([i,v])=>`<div class="item"><div class="t">${esc(mn(i))}</div><div class="bar" style="width:40%"><i style="width:${v/Math.max(...Object.values(pt))*100}%"></i></div><span class="tag">${hm(v)}</span></div>`).join('')||'<div class="mu">Noch nichts gelernt. Starte deine erste Runde!</div>'}<form class="row" style="margin-top:12px" onsubmit="return addMin(event)"><input name="n" type="number" min="1" placeholder="Minuten" style="width:110px" required><button class="b g">+ Lernzeit manuell eintragen</button></form></div>`},
cards(){const ms=modsOf(S.sem);if(!ms.find(m=>m.id==NM)){NM=ms[0].id;NN=null}const l=S.cards[NM]||[];let c=l.find(x=>x.id==CS.id);if(!c&&l.length){c=cardPick(l);CS.id=c.id;CS.f=0}
 return `<div class="pills">${ms.map(m=>`<button class="${m.id==NM?'on':''}" onclick="NM='${m.id}';CS.id=0;CS.f=0;render()">${esc(m.n)}</button>`).join('')}</div>
 <div class="card"><h2>Karteikarten · ${esc(mn(NM))} <span class="mu">${l.filter(x=>x.b>=2).length}/${l.length} sitzen</span></h2>${c?`<div class="fc" onclick="CS.f=!CS.f;render()">${esc(CS.f?c.a:c.q)}</div><div class="mu" style="text-align:center;margin:6px 0 10px">${CS.f?'Antwort':'Frage'} · tippen zum Umdrehen</div>${CS.f?`<div class="row" style="justify-content:center"><button class="b" style="background:var(--er);border-color:var(--er)" onclick="cg(0)">Nochmal</button><button class="b" style="background:var(--ok);border-color:var(--ok)" onclick="cg(1)">Gewusst</button></div>`:''}`:'<div class="mu">Noch keine Karten für dieses Fach.</div>'}
 <form class="row" style="margin-top:12px" onsubmit="return addCard(event)"><input name="q" placeholder="Frage / Begriff" required style="flex:1;min-width:140px"><input name="a" placeholder="Antwort" required style="flex:1;min-width:140px"><button class="b">+</button></form>
 ${l.map(x=>`<div class="item"><div class="t">${esc(x.q)}<div class="mu">${esc(x.a)}</div></div><span class="tag">Stufe ${x.b}</span><button class="x" onclick="S.cards[NM]=S.cards[NM].filter(a=>a.id!='${x.id}');CS.id=0;save();render()">✕</button></div>`).join('')}</div>`},
sem(){return [1,2,3,4,5,6,7].map(s=>`<div class="card"><h2>Semester ${s} <span class="mu">· ${modsOf(s).reduce((a,m)=>a+(m.s.length>1?m.cp/2:m.cp),0)} CP${s==6||s==7?' · als Auslandssemester möglich':''}</span></h2>${modsOf(s).map(m=>`<div class="item"><div class="t">${esc(m.n)}</div><span class="tag">${m.cp} CP${m.s.length>1?' (Sem. 6–7)':''}</span></div>`).join('')}<button class="b g" onclick="S.sem=${s};S.tab='dash';save();render()">Dieses Semester aktivieren</button></div>`).join('')+`<div class="mu">Schwerpunkt: Ab Semester 4 wählst du einen der vier Schwerpunkte und vertiefst ihn in Sem. 6–7. Gesamt: 210 CP.</div>`}
};
function render(){$('sem').innerHTML=[1,2,3,4,5,6,7].map(s=>`<option ${s==S.sem?'selected':''}>${s}</option>`).join('');
 $('nav').innerHTML=TABS.map(([k,l])=>`<button class="${k==S.tab?'on':''}" onclick="S.tab='${k}';save();render()">${l}</button>`).join('');
 const a=document.activeElement;if(a&&a.tagName=='TEXTAREA'||a&&a.tagName=='INPUT'&&a.closest('main')&&S.tab=='notes')return;
 $('main').innerHTML=V[S.tab]()}
function addTodo(e){e.preventDefault();const f=e.target;S.todos.push({id:uid(),x:f.x.value,m:f.m.value,d:f.d.value,p:+f.p.value,sem:S.sem,done:0});save();render();return false}
function tg(id){const t=S.todos.find(a=>a.id==id);t.done=t.done?0:1;save();render()}
function addEx(e){e.preventDefault();const f=e.target;S.exams.push({id:uid(),m:f.m.value,d:f.d.value,tm:f.tm.value,r:f.r.value,sem:S.sem});save();render();return false}
function addEv(e){e.preventDefault();const f=e.target,t=new Date(SD+'T'+f.tm.value).getTime();S.events.push({id:uid(),title:f.t.value,t,e:t,loc:''});save();render();return false}
function newNote(){const n={id:uid(),t:'Neuer Zettel',x:'Kernaussagen\n- \n\nFormeln / Definitionen\n- \n\nBeispiele\n- \n\nOffene Fragen\n- \n'};(S.notes[NM]=S.notes[NM]||[]).push(n);NN=n.id;save();render()}
function eN(k,v){const n=(S.notes[NM]||[]).find(a=>a.id==NN);if(n){n[k]=v;save()}}
function delNote(){if(confirm('Lernzettel löschen?')){S.notes[NM]=S.notes[NM].filter(a=>a.id!=NN);NN=null;save();render()}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='studyhub-backup.json';a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(S,JSON.parse(r.result));save();render()}catch(e){alert('Ungültige Datei')}};r.readAsText(f)}
render();
</script>
</body>
</html>
